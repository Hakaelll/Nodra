name: Validate
on: [push, pull_request]
jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nodra
          POSTGRES_PASSWORD: nodra_local
          POSTGRES_DB: nodra_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nodra -d nodra_test" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nodra:nodra_local@localhost:5432/nodra_test
      TEST_DATABASE_URL: postgresql://nodra:nodra_local@localhost:5432/nodra_test
      JWT_SECRET: ci-test-only-secret-at-least-64-characters-never-for-production-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm -r --filter './packages/*' build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm db:verify-bootstrap
      - run: pnpm test:web-vertical
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
